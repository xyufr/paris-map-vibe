  <body>
    <noscript>
      <div style="max-width:640px;margin:32px auto;padding:20px 24px;font:16px/1.6 system-ui,sans-serif">
        <h1>Paris Transit Map · Métro, RER, Tram &amp; Transilien</h1>
        <p>An interactive map of the Île-de-France public transport network, drawn from the official IDFM plan (January 2026). It needs JavaScript.</p>
        <ul>
          <li>Métro, RER, Transilien, tram, cable and airport shuttle lines with 997 stations.</li>
          <li>Accent-insensitive station search, line focus and neighbouring stops.</li>
          <li>Journey planning (fastest or fewer transfers), shareable links and offline use.</li>
          <li>Available in English, French and Chinese.</li>
        </ul>
        <p>Plan interactif des transports d’Île-de-France · 巴黎公共交通互动地图. See also the <a href="https://xyufr.com/">illustrated 3D map of Paris</a>.</p>
      </div>
    </noscript>
    <main class="app-shell" id="app">
      <aside class="rail" id="rail" aria-label="Controls">
        <header class="brand">
          <div class="brand-text">
            <h1><span class="title-main">Paris</span> <em class="title-accent" data-i18n="titleAccent">en transports</em></h1>
            <p data-i18n="subtitle">Île-de-France · PDF plan 2026</p>
            <div class="segmented lang-switch" role="group" aria-label="Language / Langue / 语言">
              <button type="button" data-lang="en">EN</button>
              <button type="button" data-lang="fr">FR</button>
              <button type="button" data-lang="zh">中文</button>
            </div>
          </div>
          <button id="themeToggle" class="icon-button" type="button" data-i18n-title="theme" title="Theme" aria-label="Toggle theme">◐</button>
          <button id="railToggle" class="icon-button rail-toggle" type="button" aria-label="Collapse panel" aria-expanded="true">▾</button>
        </header>

        <div class="rail-body">
          <nav class="tabs" role="tablist">
            <button class="tab is-active" role="tab" data-tab="explore" aria-selected="true" data-i18n="tabExplore">Explore</button>
            <button class="tab" role="tab" data-tab="route" aria-selected="false" data-i18n="tabRoute">Route</button>
            <button class="tab" role="tab" data-tab="lines" aria-selected="false" data-i18n="tabLines">Lines</button>
          </nav>

          <section class="tab-panel is-active" data-panel="explore" role="tabpanel">
            <div class="field search-field">
              <input id="stationSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" placeholder="Search a station  ( / )" aria-label="Search a station">
              <div class="suggestions" role="listbox" hidden></div>
            </div>
            <div id="details" class="details" aria-live="polite"></div>
            <button id="resetAll" class="reset-button" type="button">↺ <span data-i18n="resetAll">Reset map</span></button>
          </section>

          <section class="tab-panel" data-panel="route" role="tabpanel" hidden>
            <div class="route-form">
              <div class="field route-field">
                <span class="route-dot from" aria-hidden="true"></span>
                <input id="routeFrom" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="from" placeholder="From" aria-label="From">
                <div class="suggestions" role="listbox" hidden></div>
              </div>
              <button id="routeSwap" class="icon-button swap" type="button" data-i18n-title="swap" title="Swap" aria-label="Swap">⇅</button>
              <div class="field route-field">
                <span class="route-dot to" aria-hidden="true"></span>
                <input id="routeTo" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="to" placeholder="To" aria-label="To">
                <div class="suggestions" role="listbox" hidden></div>
              </div>
              <label class="check"><input id="avoidTrain" type="checkbox"> <span data-i18n="metroOnly">Metro &amp; tram only</span></label>
            </div>
            <div id="routeResult" class="route-result" aria-live="polite"></div>
            <button id="resetRoute" class="reset-button" type="button">↺ <span data-i18n="resetAll">Reset map</span></button>
          </section>

          <section class="tab-panel" data-panel="lines" role="tabpanel" hidden>
            <div class="lines-head">
              <span class="hint" data-i18n="linesHint">Click to focus a line · Ctrl/⌘-click to combine</span>
              <button id="clearLines" class="text-button" type="button" data-i18n="showAll">Show all</button>
            </div>
            <div id="lineFilters" class="line-filters"></div>
            <label class="check"><input id="showFuture" type="checkbox"> <span data-i18n="showFuture">Show lines under construction</span></label>
          </section>
        </div>
      </aside>

      <section class="map-stage" aria-label="Map">
        <svg id="metroMap" role="img" aria-label="Paris transit map"></svg>
        <div class="map-controls">
          <button id="zoomIn" type="button" class="map-button" data-i18n-title="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zoomOut" type="button" class="map-button" data-i18n-title="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zoomReset" type="button" class="map-button" data-i18n-title="resetView" title="Reset view" aria-label="Reset view">⌂</button>
          <button id="shareLink" type="button" class="map-button" data-i18n-title="share" title="Copy link" aria-label="Copy link">⤴</button>
        </div>
        <div id="status" class="status-chip">Loading…</div>
        <div id="toast" class="toast" role="status" hidden></div>
        <div id="tooltip" class="tooltip" hidden></div>
      </section>
    </main>

    <script src="/vendor/d3.min.js"></script>
